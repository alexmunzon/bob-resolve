[project]
name = "bob-resolve"
version = "0.0.0"
description = "Entity resolution for agency books of business: same-person matching, golden records, households, and a review queue. Synthetic data only."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "polars",
    "duckdb",
    "pydantic>=2",
    "typer",
    "rich",
    "httpx",
    "jellyfish",
]

[project.scripts]
bob-resolve = "bob_resolve.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bob_resolve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
