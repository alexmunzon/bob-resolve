[project]
name = "bob-resolve"
version = "0.1.0"
description = "Entity resolution for agency books of business: same-person matching, golden records, households, and a review queue. Synthetic data only."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "polars",
    "duckdb",
    "pydantic>=2",
    "typer",
    "rich",
    "httpx",
    "jellyfish",
    # TEMPORARY local pin (PR 10): the commons GitHub repo does not exist yet. When it does, this
    # becomes git+https://github.com/alexmunzon/agency-data-commons@v0.2.0 (same tag). The space in
    # "Data intake" must be written %20 in the URL. See docs/pr-10-notes.md.
    "agency-data-commons @ git+file:///Users/alexmunzon/Data%20intake/agency-data-commons@v0.2.0",
]

[project.scripts]
bob-resolve = "bob_resolve.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Needed for the direct git reference above (hatchling refuses one otherwise).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/bob_resolve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
